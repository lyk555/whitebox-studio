<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舞台</title>
<link rel="stylesheet" href="/vendor/fonts/noto-serif-sc/400.css">
<link rel="stylesheet" href="/vendor/fonts/noto-serif-sc/500.css">
<script>if (parent !== window) document.documentElement.classList.add('embedded')</script>
<style>
  :root { color-scheme: dark; --bg: #0c0d0f; --panel: #1a1c20; --line: #2c2f35; --text: #ececea; --heading: #f5f5f2; --dim: #8b8e94; --accent: #8ea0ff; --accent-text: #c2ccff; --caption: 124px; --story: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif; }
  .embedded { --caption: 92px; }
  .embedded .bar { display: none; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  /* The picture takes whatever room the frame has, and the caption always has its own below it. */
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; aspect-ratio: 16 / 9; height: min(calc(100vh - var(--caption)), calc(100vw * 9 / 16)); background: #000; overflow: hidden; }
  #stage canvas, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage video { opacity: 0; pointer-events: none; }
  #start { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 13px 30px; font: 500 19px var(--story); letter-spacing: .04em; color: var(--heading); background: rgba(12, 13, 15, .72); border: 1px solid rgba(255, 255, 255, .5); border-radius: 10px; backdrop-filter: blur(8px); }
  #start:hover { background: rgba(255, 255, 255, .14); }
  #hud { position: absolute; z-index: 1; left: 2%; bottom: 3%; display: flex; align-items: flex-end; gap: 10px; pointer-events: none; opacity: .86; }
  #hud[hidden] { display: none; }
  .hud-keys { display: grid; grid-template-columns: repeat(3, 32px); grid-template-rows: repeat(2, 32px); gap: 3px; }
  .hud-key { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; border-radius: 7px; color: #e8e6e1; background: rgba(12, 13, 15, .55); border: 1px solid rgba(232, 230, 225, .2); }
  .hud-key b { font-size: 14px; font-weight: 500; }
  .hud-key small { display: none; }
  .hud-key[data-key="up"] { grid-column: 2; grid-row: 1; }
  .hud-key[data-key="left"] { grid-column: 1; grid-row: 2; }
  .hud-key[data-key="down"] { grid-column: 2; grid-row: 2; }
  .hud-key[data-key="right"] { grid-column: 3; grid-row: 2; }
  .hud-key.on { color: #0c0d0f; background: var(--accent); border-color: var(--accent); }
  .hud-gyro { width: 86px; height: 86px; }
  .fixed-view .hud-gyro { display: none; }
  .hud-face { fill: rgba(12, 13, 15, .55); stroke: rgba(232, 230, 225, .2); }
  .hud-sky { fill: rgba(120, 150, 180, .24); }
  .hud-ground { fill: rgba(142, 160, 255, .2); }
  .hud-horizon line { stroke: #e8e6e1; stroke-width: 1; }
  .hud-ring line { stroke: rgba(232, 230, 225, .5); stroke-width: 1; }
  .hud-ring text { fill: rgba(232, 230, 225, .7); font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
  .hud-ring text.north { fill: var(--accent); font-weight: 700; }
  .hud-facing { fill: #e8e6e1; stroke: #0c0d0f; stroke-width: .8; }
  .hud-mouse { fill: var(--accent); stroke: #0c0d0f; stroke-width: .8; }
  .hud-view { fill: var(--accent); }
  #caption { width: 100%; max-width: 900px; flex: none; height: var(--caption); padding: 12px 18px 8px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  #story { min-height: 28px; font: 400 17px/1.6 var(--story); color: var(--heading); text-align: center; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px; min-height: 24px; }
  #objective { color: var(--dim); font-size: 13px; }
  #prompt { color: var(--accent-text); font-size: 13px; font-weight: 500; }
  #prompt:empty, #objective:empty { display: none; }
  #items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #items:empty { display: none; }
  .item { display: flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1px 9px 1px 3px; font-size: 12px; }
  .item img { width: 22px; height: 22px; object-fit: contain; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: auto; color: var(--dim); font-size: 11.5px; opacity: .78; }
  .bar span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button { background: transparent; color: var(--dim); border: 0; padding: 2px 6px; font: inherit; cursor: pointer; border-radius: 6px; }
  .bar button:hover { color: var(--accent-text); background: rgba(255, 255, 255, .1); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #log { display: none; }
  #stage-loading { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: #0c0d0f; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div id="stage"><canvas id="view" width="1280" height="720" tabindex="0"></canvas><div id="stage-loading">正在布置舞台……</div><button id="start" hidden></button><div id="hud" hidden></div></div>
  <div id="caption">
    <div id="story" aria-live="polite"></div>
    <div class="meta"><div id="objective"></div><div id="prompt"></div><div id="items"></div></div>
    <div class="bar">
      <span>方向键或 WASD 走动 · 按 E 互动 · 空格跳过视频</span>
      <button id="toggle">白模 / 画面</button>
      <button id="reset">重来</button>
    </div>
  </div>
  <div id="log"></div>
</main>
<script>
  // A job page has nobody watching it, so a page that fails to even start has to say so itself.
  const jobId = new URLSearchParams(location.search).get('job')
  if (jobId) {
    const fail = message => fetch('api/job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: jobId, error: String(message) }) })
    addEventListener('error', event => { fail(event.message) })
    addEventListener('unhandledrejection', event => { fail(event.reason?.message ?? event.reason) })
  }
</script>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<script type="module" src="game.js"></script>
</body>
</html>
